<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planejamento Semestral 2026-2027</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts: Oswald / Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Estilo Customizado -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container-fluid py-4 px-4" id="exportArea">
      <!-- Barra Superior -->
      <header
        class="d-flex flex-wrap justify-content-between align-items-center pb-3 mb-4 border-bottom"
      >
        <div>
          <h2 class="title-app mb-0">PLANEJAMENTO SEMESTRAL 2026-2027</h2>
          <span class="text-muted small"
            >Férias, Folgas, Recessos e Viagens</span
          >
        </div>
        <div
          class="d-flex gap-2 align-items-center mt-3 mt-md-0"
          data-html2canvas-ignore="true"
        >
          <button
            id="btnNovoAgendamento"
            class="btn btn-warning fw-semibold shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#modalEvento"
          >
            <i class="bi bi-calendar-plus-fill me-1"></i> Novo Agendamento
          </button>

          <!-- Input de arquivo oculto e botão para restaurar backup JSON -->
          <input
            type="file"
            id="inputImportarJSON"
            accept=".json"
            class="d-none"
          />
          <button
            id="btnImportarJSON"
            class="btn btn-outline-secondary fw-semibold shadow-sm"
            title="Restaurar agendamentos via ficheiro JSON"
          >
            <i class="bi bi-upload me-1"></i> Importar JSON
          </button>

          <!-- Botão combinado: descarrega o JSON e gera o PDF -->
          <button
            id="btnExportarPDF"
            class="btn btn-dark fw-semibold shadow-sm"
            title="Descarrega o documento PDF e o backup JSON"
          >
            <i class="bi bi-file-earmark-pdf-fill me-1"></i> Gerar PDF + Baixar
            JSON
          </button>
        </div>
      </header>

      <div class="row g-4">
        <!-- Grade dos 6 Meses (Esquerda) -->
        <section class="col-xl-8 col-lg-7">
          <div
            class="row row-cols-1 row-cols-md-2 g-4"
            id="calendariosContainer"
          >
            <!-- Gerado dinamicamente via JS: Novembro 2026 a Abril 2027 -->
          </div>
        </section>

        <!-- Painel de Agendamentos (Direita) -->
        <aside class="col-xl-4 col-lg-5">
          <div
            class="card shadow-sm border-0 schedule-sidebar sticky-top"
            style="top: 20px"
          >
            <div
              class="card-header bg-white border-0 pt-3 pb-2 d-flex justify-content-between align-items-center"
            >
              <h5 class="title-panel mb-0">AGENDAMENTOS</h5>
              <div
                class="d-flex align-items-center gap-2"
                data-html2canvas-ignore="true"
              >
                <label
                  for="filtroOrdenacao"
                  class="small text-muted fw-bold mb-0"
                  >Ordem:</label
                >
                <select
                  id="filtroOrdenacao"
                  class="form-select form-select-sm"
                  style="width: auto"
                >
                  <option value="data-asc">Data (crescente)</option>
                  <option value="data-desc">Data (decrescente)</option>
                  <option value="prioridade">
                    Prioridade (Alta &gt; Baixa)
                  </option>
                </select>
              </div>
            </div>
            <div class="card-body p-3">
              <div id="listaAgendamentos" class="d-flex flex-column gap-2">
                <!-- Lista de agendamentos renderizada dinamicamente -->
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Modal Cadastro/Edição de Agendamento -->
    <div
      class="modal fade"
      id="modalEvento"
      tabindex="-1"
      aria-labelledby="modalEventoLabel"
      aria-hidden="true"
      data-html2canvas-ignore="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formAgendamento">
            <div class="modal-header bg-dark text-white">
              <h5 class="modal-title" id="modalEventoLabel">
                Cadastrar Agendamento
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="agendamentoId" />

              <div class="mb-3">
                <label for="titulo" class="form-label fw-bold small"
                  >Título / Descrição Curta *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="titulo"
                  placeholder="Ex: RECESSO, DISSIDIO, VIAGEM..."
                  required
                />
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="dataInicio" class="form-label fw-bold small"
                    >Data Inicial *</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="dataInicio"
                    min="2026-11-01"
                    max="2027-04-30"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="dataFim" class="form-label fw-bold small"
                    >Data Final (opcional)</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="dataFim"
                    min="2026-11-01"
                    max="2027-04-30"
                  />
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="horario" class="form-label fw-bold small"
                    >Horário (se houver)</label
                  >
                  <input type="time" class="form-control" id="horario" />
                </div>
                <div class="col-md-6">
                  <label for="prioridade" class="form-label fw-bold small"
                    >Prioridade</label
                  >
                  <select id="prioridade" class="form-select">
                    <option value="none">Sem Prioridade</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label for="detalhes" class="form-label fw-bold small"
                  >Descrição Detalhada</label
                >
                <textarea
                  class="form-control"
                  id="detalhes"
                  rows="3"
                  placeholder="Anotações adicionais, observações, passagens..."
                ></textarea>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-warning fw-semibold">
                Salvar Agendamento
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts: Bootstrap 5 Bundle e html2pdf.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Lógica Principal -->
    <script src="js/script.js"></script>
  </body>
</html>
