<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planejamento Semestral</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- SweetAlert2 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts: Oswald / Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Estilos da Aplicação -->
    <link rel="stylesheet" href="css/style.css?v=3.3" />
  </head>
  <body class="bg-light">
    <div class="container-fluid py-3 px-2 px-md-4" id="exportArea">
      <!-- Cabeçalho Principal -->
      <header
        class="d-flex flex-wrap justify-content-between align-items-center pb-2 mb-3 border-bottom gap-2"
      >
        <div>
          <h2 class="title-app mb-0" id="tituloApp">PLANEJAMENTO SEMESTRAL</h2>
          <span class="text-muted small"
            >Férias, Folgas, Recessos, Viagens, Passeios e Feriados</span
          >
        </div>
        <div
          class="d-flex flex-wrap gap-2 align-items-center"
          data-html2canvas-ignore="true"
        >
          <!-- Configurações do Semestre -->
          <button
            id="btnConfiguracoes"
            class="btn btn-outline-dark btn-sm fw-semibold shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#modalConfiguracoes"
            title="Definir mês e ano inicial do semestre"
          >
            <i class="bi bi-gear-fill me-1"></i> Configurações
          </button>

          <button
            id="btnNovoAgendamento"
            class="btn btn-warning btn-sm fw-semibold shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#modalEvento"
          >
            <i class="bi bi-calendar-plus-fill me-1"></i> Novo Agendamento
          </button>

          <!-- Botão para sincronizar e limpar dados antigos do telemóvel -->
          <button
            id="btnRestaurarPadrao"
            class="btn btn-outline-danger btn-sm fw-semibold shadow-sm"
            title="Recarregar dados atualizados e limpar cache local"
          >
            <i class="bi bi-arrow-clockwise me-1"></i> Sincronizar
          </button>

          <input
            type="file"
            id="inputImportarJSON"
            accept=".json"
            class="d-none"
          />
          <button
            id="btnImportarJSON"
            class="btn btn-outline-secondary btn-sm fw-semibold shadow-sm"
            title="Restaurar backup JSON"
          >
            <i class="bi bi-upload me-1"></i> Importar JSON
          </button>

          <button
            id="btnExportarPDF"
            class="btn btn-dark btn-sm fw-semibold shadow-sm"
            title="Descarrega PDF em folha única e backup JSON"
          >
            <i class="bi bi-file-earmark-pdf-fill me-1"></i> Gerar PDF + Baixar
            JSON
          </button>
        </div>
      </header>

      <div class="row g-3" id="conteudoPrincipal">
        <!-- Secção dos Meses -->
        <section class="col-12 col-xl-7 col-lg-7" id="colunaMeses">
          <div
            class="row row-cols-1 row-cols-md-2 g-2"
            id="calendariosContainer"
          >
            <!-- Calendários gerados dinamicamente via JS -->
          </div>
        </section>

        <!-- Painel de Agendamentos -->
        <aside class="col-12 col-xl-5 col-lg-5" id="colunaAgendamentos">
          <div
            class="card shadow-sm border-0 schedule-sidebar sticky-top"
            style="top: 15px"
          >
            <div
              class="card-header bg-white border-0 pt-2 pb-2 d-flex flex-wrap justify-content-between align-items-center gap-2"
            >
              <h5 class="title-panel mb-0">AGENDAMENTOS</h5>
              <div
                class="d-flex flex-wrap align-items-center gap-2"
                data-html2canvas-ignore="true"
              >
                <!-- Alternar Colapsar / Expandir Todos os Cards -->
                <button
                  id="btnAlternarTodosCards"
                  class="btn btn-sm btn-outline-secondary py-1 px-2"
                  title="Colapsar / Expandir Todos"
                >
                  <i class="bi bi-arrows-collapse" id="iconeAlternarCards"></i>
                </button>

                <label
                  for="filtroOrdenacao"
                  class="small text-muted fw-bold mb-0"
                  >Ordem:</label
                >
                <select
                  id="filtroOrdenacao"
                  class="form-select form-select-sm"
                  style="width: auto"
                >
                  <option value="data-asc">Data (crescente)</option>
                  <option value="data-desc">Data (decrescente)</option>
                  <option value="categoria">Categoria</option>
                  <option value="prioridade">Prioridade</option>
                </select>
              </div>
            </div>
            <div class="card-body p-2">
              <div id="listaAgendamentos" class="d-flex flex-column gap-1">
                <!-- Cards de agendamentos gerados dinamicamente -->
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <!-- Modal Configurações de Semestre -->
    <div
      class="modal fade"
      id="modalConfiguracoes"
      tabindex="-1"
      aria-labelledby="modalConfiguracoesLabel"
      aria-hidden="true"
      data-html2canvas-ignore="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
          <form id="formConfiguracoes">
            <div class="modal-header bg-dark text-white">
              <h5 class="modal-title fs-6" id="modalConfiguracoesLabel">
                <i class="bi bi-gear-fill me-1"></i> Período Semestral
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label for="configMesInicio" class="form-label fw-bold small"
                  >Mês Inicial</label
                >
                <select
                  id="configMesInicio"
                  class="form-select form-select-sm"
                  required
                >
                  <option value="0">Janeiro</option>
                  <option value="1">Fevereiro</option>
                  <option value="2">Março</option>
                  <option value="3">Abril</option>
                  <option value="4">Maio</option>
                  <option value="5">Junho</option>
                  <option value="6">Julho</option>
                  <option value="7">Agosto</option>
                  <option value="8">Setembro</option>
                  <option value="9">Outubro</option>
                  <option value="10" selected>Novembro</option>
                  <option value="11">Dezembro</option>
                </select>
              </div>
              <div class="mb-2">
                <label for="configAnoInicio" class="form-label fw-bold small"
                  >Ano Inicial</label
                >
                <input
                  type="number"
                  id="configAnoInicio"
                  class="form-control form-control-sm"
                  value="2026"
                  min="2020"
                  max="2040"
                  required
                />
              </div>
              <div class="text-muted small mt-2">
                A aplicação recalculará automaticamente os 6 meses e buscará os
                feriados correspondentes.
              </div>
            </div>
            <div class="modal-footer bg-light p-2">
              <button
                type="button"
                class="btn btn-sm btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
              <button type="submit" class="btn btn-sm btn-warning fw-semibold">
                Aplicar Alterações
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Cadastro/Edição de Agendamento -->
    <div
      class="modal fade"
      id="modalEvento"
      tabindex="-1"
      aria-labelledby="modalEventoLabel"
      aria-hidden="true"
      data-html2canvas-ignore="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formAgendamento">
            <div class="modal-header bg-dark text-white">
              <h5 class="modal-title fs-6" id="modalEventoLabel">
                Cadastrar Agendamento
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="agendamentoId" />

              <div class="mb-3">
                <label for="titulo" class="form-label fw-bold small"
                  >Título / Descrição *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="titulo"
                  placeholder="Ex: FÉRIAS FABIANA, VIAGEM SÃO PAULO..."
                  required
                />
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="categoria" class="form-label fw-bold small"
                    >Categoria / Tipo *</label
                  >
                  <select id="categoria" class="form-select" required>
                    <option value="ferias">Férias (Verde)</option>
                    <option value="recesso">Recesso (Amarelo)</option>
                    <option value="dissidio">Dissídio (Laranja)</option>
                    <option value="saude">
                      Saúde / Consulta (Ciano Suave)
                    </option>
                    <option value="viagem">Viagem (Azul Suave)</option>
                    <option value="passeio">Passeio (Lavanda/Lilás)</option>
                    <option value="geral">Geral / Outros (Cinza)</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="prioridade" class="form-label fw-bold small"
                    >Prioridade</label
                  >
                  <select id="prioridade" class="form-select">
                    <option value="none">Sem Prioridade</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                  </select>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="dataInicio" class="form-label fw-bold small"
                    >Data Inicial *</label
                  >
                  <input
                    type="date"
                    class="form-control"
                    id="dataInicio"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label for="dataFim" class="form-label fw-bold small"
                    >Data Final (opcional)</label
                  >
                  <input type="date" class="form-control" id="dataFim" />
                </div>
              </div>

              <div class="mb-3">
                <label for="horario" class="form-label fw-bold small"
                  >Horário (se houver)</label
                >
                <input type="time" class="form-control" id="horario" />
              </div>

              <div class="mb-3">
                <label for="detalhes" class="form-label fw-bold small"
                  >Descrição Detalhada</label
                >
                <textarea
                  class="form-control"
                  id="detalhes"
                  rows="3"
                  placeholder="Anotações adicionais, observações, itinerário..."
                ></textarea>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-warning fw-semibold">
                Salvar Agendamento
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bibliotecas JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Lógica Principal -->
    <script src="js/script.js?v=3.3"></script>
  </body>
</html>
